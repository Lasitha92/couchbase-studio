<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="118" height="118" rx="27" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" />

  <!-- Database Cluster Node Accents -->
  <circle cx="100" cy="26" r="4.5" fill="#38BDF8" opacity="0.9" />
  <circle cx="112" cy="38" r="3" fill="#93C5FD" opacity="0.75" />
  <line x1="100" y1="26" x2="112" y2="38" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Stylized Monogram "CS" -->
  <g filter="url(#glow)">
    <!-- Letter C -->
    <path
      d="M 52 40
         C 46 33, 36 33, 30 39
         C 20 49, 20 79, 30 89
         C 36 95, 46 95, 52 88"
      fill="none"
      stroke="url(#letterGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter S -->
    <path
      d="M 94 42
         C 90 35, 79 33, 73 37
         C 65 42, 64 51, 74 57
         C 87 65, 87 76, 78 84
         C 70 91, 59 88, 56 82"
      fill="none"
      stroke="url(#letterGrad)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Cyan accent dot at bottom of C -->
  <circle cx="52" cy="88" r="3" fill="#38BDF8" />
</svg>
